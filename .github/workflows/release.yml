name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tag:
    name: Tag de versão
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.name }}
      tag_created: ${{ steps.create_tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versão do pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Criar tag se não existir e decidir se publica
        id: create_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG já publicada, pulando."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG já existe, mas não há release publicada: seguindo com o build."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: tag
    if: ${{ needs.tag.outputs.tag_created == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  windows:
    name: Build Windows
    runs-on: windows-2022
    needs: [tag, test]
    if: ${{ needs.tag.outputs.tag_created == 'true' }}
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: true

      - run: flutter pub get

      - name: Configurar env de produção
        shell: bash
        env:
          PROD_ENV_JSON: ${{ secrets.PROD_ENV_JSON }}
        run: |
          mkdir -p env
          printf '%s' "$PROD_ENV_JSON" > env/prod.json

      - name: Build Windows
        run: flutter build windows --release --dart-define-from-file=env/prod.json

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          $isccPath = if ($iscc) { $iscc.Source } else { Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $isccPath)) { throw 'Inno Setup Compiler não encontrado.' }
          & $isccPath "/DAppVersion=${{ needs.tag.outputs.version }}" installer\orama_fabrica.iss

      - uses: actions/upload-artifact@v4
        with:
          name: orama_fabrica-windows
          path: installer/orama_fabrica_setup_${{ needs.tag.outputs.version }}.exe
          if-no-files-found: error

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [tag, test, windows]
    if: ${{ needs.tag.outputs.tag_created == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.38.1
          cache: true

      - run: flutter pub get

      - name: Configurar env de produção
        env:
          PROD_ENV_JSON: ${{ secrets.PROD_ENV_JSON }}
        run: |
          mkdir -p env
          printf '%s' "$PROD_ENV_JSON" > env/prod.json

      - name: Configurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=keystore.jks"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=env/prod.json

      - name: Build AAB
        run: flutter build appbundle --release --dart-define-from-file=env/prod.json

      - uses: actions/download-artifact@v4
        with:
          name: orama_fabrica-windows

      - name: Gerar release notes
        id: notes
        run: |
          TAG="v${{ needs.tag.outputs.version }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s|%h" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s|%h" "${PREV_TAG}..HEAD")
          fi

          declare -A sections
          sections[feat]="✨ Novidades"
          sections[fix]="🐛 Correções"
          sections[perf]="⚡ Melhorias de desempenho"
          sections[refactor]="♻️ Refatorações"
          sections[chore]="🔧 Manutenção"
          sections[docs]="📝 Documentação"
          sections[test]="✅ Testes"
          declare -A lines

          re='^([a-z]+)(\([^)]+\))?(!)?:\ (.+)$'
          while IFS= read -r entry; do
            msg="${entry%|*}"
            if [[ "$msg" =~ $re ]]; then
              type="${BASH_REMATCH[1]}"
              scope_clean="${BASH_REMATCH[2]//[()]/}"
              desc="${BASH_REMATCH[4]}"
              if [ -n "${sections[$type]+x}" ]; then
                bullet="- "
                [ -n "$scope_clean" ] && bullet+="**${scope_clean}**: "
                lines[$type]+="${bullet}${desc}"$'\n'
              fi
            fi
          done <<< "$COMMITS"

          BODY=""
          for type in feat fix perf refactor chore docs test; do
            if [ -n "${lines[$type]}" ]; then
              BODY+="${sections[$type]}"$'\n'"${lines[$type]}"$'\n'
            fi
          done
          [ -z "$BODY" ] && BODY="Sem mudanças categorizadas nesta versão."
          if [ -n "$PREV_TAG" ]; then
            BODY+=$'\n'"**Comparação completa:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$BODY"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: v${{ needs.tag.outputs.version }}
          tag_name: v${{ needs.tag.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            orama_fabrica_setup_${{ needs.tag.outputs.version }}.exe
